[theme]
base = "dark"
primaryColor = "#6366F1"

# ── Yüzeyler: shared/tasarim.py RENK sözlüğüyle BİREBİR aynı olmalı ──
backgroundColor = "#0B1120"           # RENK["yuzey0"]
secondaryBackgroundColor = "#0F172A"  # RENK["yuzey1"]
textColor = "#E2E8F0"                 # RENK["metin"]
borderColor = "#1E293B"

# ── Tipografi ──
font = "Inter, sans-serif"
headingFont = "Inter, sans-serif"
codeFont = "JetBrains Mono, monospace"

# ── Yumuşak köşeler — tasarim.py YOGUNLUK["sik"]["kart_r"] ile aynı ──
baseRadius = "10px"

# ── Tablolar: silik grid + zeminle uyumlu başlık bandı ──
dataframeBorderColor = "#1E293B"
dataframeHeaderBackgroundColor = "#152036"   # RENK["yuzey2"]

# ── AÇIK TEMA — kullanıcı HESAP › Görünüm'den seçer (shared/tercih.py).
#    Değerler shared/tasarim.py RENK_ACIK ile BİREBİR aynı olmalı.
[theme.light]
primaryColor = "#4F46E5"              # RENK_ACIK["mor"]
backgroundColor = "#F4F6FA"           # RENK_ACIK["yuzey0"]
secondaryBackgroundColor = "#FFFFFF"  # RENK_ACIK["yuzey1"]
textColor = "#0F172A"                 # RENK_ACIK["metin"]
borderColor = "#D6DCE6"
dataframeBorderColor = "#D6DCE6"
dataframeHeaderBackgroundColor = "#F1F4F9"   # RENK_ACIK["yuzey2"]

[theme.light.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F4F9"

# ── TEK font kaynağı. login_css() içindeki Google Fonts @import KALDIRILMALI:
#    Inter iki yerden birden iniyordu → çift indirme + girişte yazı sıçraması.
[[theme.fontFaces]]
family = "Inter"
url = "https://rsms.me/inter/font-files/InterVariable.woff2"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono:vf@latest/latin-wght-normal.woff2"
weight = "100 800"
style = "normal"

[browser]
gatherUsageStats = false
