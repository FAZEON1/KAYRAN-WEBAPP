name: Telegram Sabah Brifingi

on:
  schedule:
    # Her gün 05:00 UTC = 08:00 Türkiye saati
    - cron: "0 5 * * *"
  workflow_dispatch: {}   # Actions sekmesinden elle test için

jobs:
  brifing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: pip install --quiet streamlit supabase requests pandas

      - name: Supabase erişimini hazırla (uygulamanın kendi secrets dosyası)
        run: |
          mkdir -p .streamlit
          cat > .streamlit/secrets.toml << SECRETS
          [supabase]
          url = "${{ secrets.SUPABASE_URL }}"
          key = "${{ secrets.SUPABASE_KEY }}"
          service_role_key = "${{ secrets.SUPABASE_KEY }}"
          SECRETS

      - name: Brifingi gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_brifing.py

      - name: Yükleme hatırlatma e-postaları
        if: always()   # Telegram adımı düşse de çalışır
        # Mail hesabı iki yoldan biriyle verilir: dört ayrı sır (SMTP_HOST/PORT/USER/PASS) ya da
        # TEK sır BILDIRIM — uygulamadaki [bildirim] biçiminde alt alta:
        #   smtp_host = "smtp.gmail.com" / smtp_port = "587" / smtp_user = "..." / smtp_pass = "..."
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          BILDIRIM: ${{ secrets.BILDIRIM }}
        run: |
          if [ -n "$BILDIRIM" ]; then
            printf '\n[bildirim]\n%s\n' "$BILDIRIM" >> .streamlit/secrets.toml
          fi
          python otonom/eposta_hatirlatma.py
