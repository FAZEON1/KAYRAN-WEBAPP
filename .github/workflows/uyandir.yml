name: Uygulamayı uyanık tut

# TR saatiyle ~08:00 · 13:00 · 18:00 · 00:00 (cron UTC; birkaç dk gecikebilir)
on:
  schedule:
    - cron: "0 5,10,15,21 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  uyandir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright kur
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Uygulamayı ziyaret et / uyandır
        env:
          STREAMLIT_APP_URL: https://kayran-corporate.streamlit.app
          EKRAN_FOTO: uyandir_son_durum.png
        run: python keepalive/uyandir.py

      - name: Başarısızsa ekran görüntüsünü yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: son-durum-ekran-goruntusu
          path: uyandir_son_durum.png
          if-no-files-found: ignore
