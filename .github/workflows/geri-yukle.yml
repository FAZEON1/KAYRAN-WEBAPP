name: Silinen İthalatı Geri Yükle

# Elle çalışır. VARSAYILAN KURU ÇALIŞMA — hiçbir şey yazmaz, ne yapacağını gösterir.
# Yazması için "onay" alanına tam olarak EVET yaz.
on:
  workflow_dispatch:
    inputs:
      dosya_id:
        description: "Geri yüklenecek ithalat_dosyalari.id"
        required: true
        default: "573"
      onay:
        description: "Gerçekten yaz (EVET yazmazsan sadece gösterir)"
        required: true
        default: "hayir"
      ara:
        description: "Kimlik yerine METİNLE ara (örn. MITAC veya 2025-14) — sadece listeler"
        required: false
        default: ""
      run_id:
        description: "Belirli bir yedek çalışması (boş bırak = en son başarılı)"
        required: false
        default: ""

permissions:
  actions: read          # yedek artifact'ını indirebilmek için
  contents: read

jobs:
  geri-yukle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: pip install --quiet supabase pandas openpyxl

      - name: Yedek artifact'ını indir
        env:
          GH_TOKEN: ${{ github.token }}
          GIRILEN_RUN: ${{ inputs.run_id }}
        run: |
          set -e
          if [ -n "$GIRILEN_RUN" ]; then
            RUN="$GIRILEN_RUN"
          else
            RUN=$(gh run list --workflow=gece-yedek.yml --status=success \
                  --limit=1 --json databaseId --jq '.[0].databaseId')
          fi
          echo "Kullanılan yedek çalışması: $RUN"
          gh run download "$RUN" --name kayran-yedek --dir yedek
          ls -la yedek

      - name: Geri yüklemeyi çalıştır
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          YEDEK_DIZIN: yedek
          DOSYA_ID: ${{ inputs.dosya_id }}
          ARA: ${{ inputs.ara }}
          ONAY: ${{ inputs.onay }}
        run: python otonom/geri_yukle.py
