name: Mikro eşitleme

# Uygulama kapalıyken de Mikro'dan satış, banka, çek, cari, gider ve stok eşitlemesi (otonom/mikro_esitle.py).
# Uygulama açıkken kendi içinde 5 dakikada bir de yapar.
# Ne zaman çalışır (Ekim 2026): aktarıcı yeni veri getirdiği turun sonunda Supabase fonksiyonu mikro-tetik
# üzerinden (repository_dispatch: mikro_esitle). Aktarıcı durursa Supabase zamanlayıcısı (pg_cron, 30 dk)
# aynı yoldan tetikler; tur sonunda sağlık denetimi Telegram'a yazar. GitHub'ın kendi zamanlayıcısı bu depoda
# saatlerce gecikiyor (02:00'lık gece yedeği 06:51–08:48'de); aşağıdaki cron yalnız 6 saatte bir yedek.
# Kod birleşince de hemen çalışır (22.10.2026): #258 birleştikten sonra yeni aktarıcı ve yurt içi eşitlemesi
# saatlerce bekledi (sıradaki tetik gelene kadar). Eşitleme ya da aktarıcı kodu main'e girince tur hemen döner.
on:
  push:
    branches: [main]
    paths:
      - "araclar/mikro_aktarici/**"
      - "otonom/mikro_esitle.py"
      - "**/mikro_*.py"
  repository_dispatch:
    types: [mikro_esitle]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: mikro-esitle
  cancel-in-progress: false

jobs:
  esitle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install --quiet streamlit supabase requests pandas openpyxl

      - name: Supabase erişimini hazırla (uygulamanın kendi secrets dosyası)
        run: |
          mkdir -p .streamlit
          cat > .streamlit/secrets.toml << SECRETS
          [supabase]
          url = "${{ secrets.SUPABASE_URL }}"
          key = "${{ secrets.SUPABASE_KEY }}"
          service_role_key = "${{ secrets.SUPABASE_KEY }}"
          SECRETS

      - name: Eşitle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ESITLE_KAYNAK: ${{ github.event_name == 'repository_dispatch' && format('tetik:{0}', github.event.client_payload.neden) || github.event_name }}
        run: python otonom/mikro_esitle.py
