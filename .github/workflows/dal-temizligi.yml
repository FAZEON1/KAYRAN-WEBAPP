          LISTE
          if grep -qE '^ *(main|bayi-portali-faz1|claude/kind-fermat-o74cah) ' liste.txt; then
            echo "Korunan dal listede — durduruldu."; exit 1
          fi
          sil=0; atla=0; yok=0
          while read -r dal sha; do
            [ -z "$dal" ] && continue
            simdi=$(gh api "repos/$REPO/git/ref/heads/$dal" --jq .object.sha 2>/dev/null || true)
            if [ -z "$simdi" ]; then echo "zaten yok   $dal"; yok=$((yok+1)); continue; fi
            if [ "$simdi" != "$sha" ]; then echo "DEĞİŞMİŞ, atlandı  $dal ($simdi)"; atla=$((atla+1)); continue; fi
            echo "dal sha  $dal $sha"
            if [ "$ONAY" = "EVET" ]; then
              gh api -X DELETE "repos/$REPO/git/refs/heads/$dal" && sil=$((sil+1))
            fi
          done < <(sed 's/^ *//' liste.txt)
          echo "silinen: $sil · atlanan (değişmiş): $atla · zaten yok: $yok"
          [ "$ONAY" = "EVET" ] || echo "KURU ÇALIŞMA — silmek için onay alanına EVET yaz."
