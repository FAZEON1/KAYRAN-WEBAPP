name: Eski Dalları Sil

# TEK SEFERLİK (Ekim 2026). Elle çalışır. VARSAYILAN KURU ÇALIŞMA — hiçbir şey silmez, ne
# sileceğini gösterir. Silmesi için "onay" alanına tam olarak EVET yaz.
# Liste: main'e birleşmiş 87 dal + içeriği main'de olan 4 dal (FAZEON1-patch-2, -43, -11-1,
# d1-cerceve). KORUNAN: main, bayi-portali-faz1, claude/kind-fermat-o74cah — listede olsalar iş durur.
# Her dal yalnız son commit'i aşağıdaki kayıtla AYNIYSA silinir (sonradan değişmişse atlanır).
# GERİ AÇMA: Actions'ta bu işin çıktısındaki "dal sha" satırından:
#   git push origin <sha>:refs/heads/<dal>
# İş bittikten sonra bu dosya ayrı bir PR ile kaldırılır.
on:
  workflow_dispatch:
    inputs:
      onay:
        description: "Gerçekten sil (EVET yazmazsan sadece gösterir)"
        required: true
        default: "hayir"

permissions:
  contents: write

jobs:
  sil:
    runs-on: ubuntu-latest
    steps:
      - name: Dalları sil
        env:
          GH_TOKEN: ${{ github.token }}
          ONAY: ${{ github.event.inputs.onay }}
          REPO: ${{ github.repository }}
