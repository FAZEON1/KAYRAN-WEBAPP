name: Talep Analizi

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      yaz:
        description: "Analizi talep kaydına da işle (1 = evet)"
        required: false
        default: ""

jobs:
  analiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıklar
        run: pip install --quiet supabase requests

      - name: Talepleri analiz et
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YAZ: ${{ inputs.yaz }}
        run: python otonom/talep_analiz.py
